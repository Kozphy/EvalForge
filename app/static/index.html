<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvalForge Control Plane</title>
  <link rel="stylesheet" href="/static/operator.css" />
</head>
<body>
  <div class="app">
    <aside class="nav">
      <div class="brand">
        <div class="brand-mark">EF</div>
        <div>
          <strong>EvalForge</strong>
          <div class="brand-sub">Evaluation Control Plane</div>
        </div>
      </div>
      <nav id="navList" class="nav-list" aria-label="Primary"></nav>
      <div class="nav-foot">
        <span class="pill muted" id="maturityPill">demo_fixture</span>
        <a class="nav-link" href="/workbench">Legacy workbench</a>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <div>
          <h1 id="pageTitle">Overview</h1>
          <p class="subtitle" id="pageSubtitle">Operator console</p>
        </div>
        <div class="top-actions">
          <span class="status-dot" id="healthDot" title="API health"></span>
          <button type="button" class="btn ghost" id="resetDemoBtn">Reset demo</button>
        </div>
      </header>

      <div id="banner" class="banner hidden" role="status"></div>
      <div id="viewRoot" class="view" aria-live="polite">
        <div class="empty">Loading…</div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/operator.js"></script>
</body>
</html>
