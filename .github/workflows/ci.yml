name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app scripts tests research finance_eval

      - name: Run tests
        run: pytest -q

      - name: Verify frozen research benchmark
        run: python -m research.dataset check

      - name: Research smoke experiment (offline, no API)
        run: |
          python -m research.run --config research/config/smoke.yaml --results-root "$RUNNER_TEMP/research" --experiment-id ci-smoke
          python -m research.run --verify "$RUNNER_TEMP/research/ci-smoke"
